name: Auto Deploy Jasper Reports to Butani EC2

on:
  push:
    branches:
      - live  # Change this to the branch you want to monitor

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy .jasper files to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.BUTANI_SSH_HOST }}
          username: ${{ secrets.BUTANI_SSH_USER }}
          password: ${{ secrets.BUTANI_SSH_PASSWORD }}
          source: "jasper/*"
          target: "/home/ubuntu/tekfilo/jewtrade/reports/jasper/"
          strip_components: 1

      - name: Deploy .jrxml files to Butani EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.BUTANI_SSH_HOST }}
          username: ${{ secrets.BUTANI_SSH_USER }}
          password: ${{ secrets.BUTANI_SSH_PASSWORD }}
          source: "jrxml/*"
          target: "/home/ubuntu/tekfilo/jewtrade/reports/jrxml/"
          strip_components: 1
